# ============================================
# TASKMASTER - DOCKER COMPOSE
# ============================================
# Services:
#   - PostgreSQL: Database
#   - backend: Spring Boot API
#   - frontend: Angular + Nginx
#
# Usage:
#   docker-compose up --build    # Build and start
#   docker-compose down          # Stop and remove
#   docker-compose down -v       # Stop, remove, and delete volumes
# ============================================

version: '3.8'

services:
  # ==========================================
  # DATABASE
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: taskmaster-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskmaster
      POSTGRES_USER: taskmaster_user
      POSTGRES_PASSWORD: taskmaster_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmaster_user -d taskmaster"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskmaster-network

  # ==========================================
  # BACKEND
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskmaster-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taskmaster
      SPRING_DATASOURCE_USERNAME: taskmaster_user
      SPRING_DATASOURCE_PASSWORD: taskmaster_pass
      JWT_SECRET: ${JWT_SECRET:-docker-default-secret-key-must-be-32-chars-long}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    networks:
      - taskmaster-network

  # ==========================================
  # FRONTEND
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskmaster-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - taskmaster-network
  # ==========================================
  # PROMETHEUS
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: taskmaster-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - taskmaster-network

  # ==========================================
  # GRAFANA
  # ==========================================
  grafana:
    image: grafana/grafana:10.1.0
    container_name: taskmaster-grafana
    restart: unless-stopped
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - taskmaster-network

  # ==========================================
  # NODE EXPORTER (Host Metrics)
  # ==========================================
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: taskmaster-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - taskmaster-network

# ============================================
# VOLUMES
# ============================================
volumes:
  postgres_data:
    driver: local
  prometheus_data:
  grafana_data:

# ============================================
# NETWORKS
# ============================================
networks:
  taskmaster-network:
    driver: bridge


