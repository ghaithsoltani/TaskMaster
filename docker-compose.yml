# ============================================
# TASKMASTER - DOCKER COMPOSE
# ============================================
# Services:
#   - PostgreSQL: Database
#   - backend: Spring Boot API
#   - frontend: Angular + Nginx
#
# Usage:
#   docker-compose up --build    # Build and start
#   docker-compose down          # Stop and remove
#   docker-compose down -v       # Stop, remove, and delete volumes
# ============================================

version: '3.8'

services:
  # ==========================================
  # DATABASE
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: taskmaster-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskmaster
      POSTGRES_USER: taskmaster_user
      POSTGRES_PASSWORD: taskmaster_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmaster_user -d taskmaster"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taskmaster-network

  # ==========================================
  # BACKEND
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskmaster-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/taskmaster
      SPRING_DATASOURCE_USERNAME: taskmaster_user
      SPRING_DATASOURCE_PASSWORD: taskmaster_pass
      JWT_SECRET: ${JWT_SECRET:-docker-default-secret-key-must-be-32-chars-long}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    networks:
      - taskmaster-network

  # ==========================================
  # FRONTEND
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskmaster-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - taskmaster-network

# ============================================
# VOLUMES
# ============================================
volumes:
  postgres_data:
    driver: local

# ============================================
# NETWORKS
# ============================================
networks:
  taskmaster-network:
    driver: bridge