spring:
  application:
    name: taskmaster-backend
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskmaster}
    username: ${SPRING_DATASOURCE_USERNAME:taskmaster_user}
    password: ${SPRING_DATASOURCE_PASSWORD:taskmaster_pass}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      schema-locations: classpath:db/migration/V1__init.sql

server:
  port: 8080
  servlet:
    context-path: /api/v1

logging:
  level:
    com.taskmaster: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

jwt:
  secret: ${JWT_SECRET:my-256-bit-secret-key-for-jwt-signing-must-be-at-least-32-characters-long}
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always